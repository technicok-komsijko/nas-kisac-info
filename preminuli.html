<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preminuli — Naš Kisač info</title>
<meta property="og:title" content="Obaveštenje — Naš Kisač info">
<meta property="og:description" content="S poštovanjem čuvamo uspomenu.">
<meta property="og:image" content="https://technicok-komsijko.github.io/nas-kisac-info/preminuli-share.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Obaveštenje — Naš Kisač info">
<meta name="twitter:description" content="S poštovanjem čuvamo uspomenu.">
<meta name="twitter:image" content="https://technicok-komsijko.github.io/nas-kisac-info/preminuli-share.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1d24;
    --bg-2:#262a33;
    --card:#20232b;
    --line:#333844;
    --text:#e8e6e2;
    --muted:#9a97a0;
    --gold:#d9a94a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--bg), var(--bg-2));
    color:var(--text);
    font-family:'Source Sans 3', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .card{
    max-width:480px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:32px 26px;
    text-align:center;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-size:1.3rem;
    margin:0 0 8px;
    color:var(--text);
  }
  p{
    line-height:1.6;
    font-size:0.95rem;
    margin:0 0 22px;
    color:var(--muted);
  }
  .btn{
    display:inline-block;
    background:transparent;
    color:var(--gold);
    text-decoration:none;
    font-weight:600;
    padding:11px 20px;
    border:1px solid var(--gold);
    border-radius:8px;
    font-size:0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>S poštovanjem čuvamo uspomenu</h1>
    <p>Obaveštenje je podeljeno sa portala Naš Kisač info. Za detalje i ostala obaveštenja, posetite sajt.</p>
    <a class="btn" href="https://technicok-komsijko.github.io/nas-kisac-info/">← Naš Kisač info</a>
  </div>
</body>
</html>
